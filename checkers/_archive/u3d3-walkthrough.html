<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>U3 D3 — Three Portfolios, Same Money</title>
<style>
/* ---------------------------------------------------------------
   Palette carried over from the printed packets so the screen and
   the paper read as one course: ledger ink, cell yellow, rule grey.
   --------------------------------------------------------------- */
:root{
  --ink:#1B3A5C;          /* packet blue  */
  --ink-deep:#12283F;
  --accent:#E87722;       /* packet orange */
  --cell:#FFF2CC;         /* packet cell yellow */
  --rule:#B8C4D0;
  --paper:#FBFAF7;
  --paper-2:#F1EEE7;
  --ok:#2F6B4F;
  --ok-soft:#E4F0E9;
  --warn:#9B3B22;
  --warn-soft:#FBE9E2;
  --muted:#6C7A88;

  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans);
  background:var(--paper-2);
  color:var(--ink-deep);
  font-size:15px;
  line-height:1.5;
  /* Column flex instead of a hardcoded header height. The old rule was
     main{height:calc(100% - 62px)}, which silently breaks the moment the
     masthead renders any taller than 62px -- a wrapped title, a zoom
     level, a different font. When it breaks, the panes stop scrolling
     internally and the whole PAGE scrolls, which drags the formula bar
     off the top of the screen. That is the bug students hit. */
  display:flex;
  flex-direction:column;
}
header{flex:0 0 auto}
button{font:inherit}

/* ---------- masthead ---------- */
header{
  background:var(--ink);
  color:#fff;
  padding:14px 22px;
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
  border-bottom:3px solid var(--accent);
}
header .unit{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:#9FC0DC;
}
header h1{
  font-family:var(--serif);font-weight:600;font-size:22px;margin:0;
  letter-spacing:-.01em;
}
header .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:#9FC0DC}

/* ---------- layout ---------- */
main{
  flex:1 1 auto;
  min-height:0;          /* without this a flex child refuses to shrink,
                            and its children never get a scrollbar */
  display:grid;
  /* instructions left, sheet right. Wider instruction column than the
     original: the step bodies now carry the WANT/HAVE/CONNECT/SHAPE
     reasoning, which needs room to breathe. */
  grid-template-columns:minmax(360px,46%) 1fr;
  gap:0;
}
@media (max-width:1100px){
  main{grid-template-columns:minmax(320px,44%) 1fr}
}
/* Only stack when there is genuinely no room for two columns. */
@media (max-width:720px){
  main{grid-template-columns:1fr;height:auto}
  #sheetpane{border-left:none;border-top:1px solid var(--rule)}
  /* Bounding the grid restores internal scrolling, which is what makes
     the sticky column headers and the sticky formula bar work on a
     phone the same way they do on a laptop. */
  #gridwrap{max-height:60vh;padding:10px}
  /* Fingers are not mouse pointers. */
  th,td{height:36px}
  td{padding:6px 9px;font-size:14px}
  th.rowhead{min-width:34px;max-width:34px}
}

/* ---------- steps ---------- */
#steps{
  background:var(--paper);
  min-height:0;
  overflow-y:auto;
  padding:22px 22px 60px;
  border-right:1px solid var(--rule);
}
/* Step bodies carry literal newlines between the four questions, so keep
   them instead of collapsing the whitespace. */
.step .body{white-space:pre-line}
/* The deliverable. Reasoning fades across the lesson; this never does.
   Students reported the late steps as unclear -- not because the thinking
   was too hard, but because "what do I actually type, and where" had been
   faded away along with the scaffolding. Different things. */
.step .do{
  margin:12px 0 0;padding:9px 12px;
  background:var(--paper-2);border-left:3px solid var(--accent);
  border-radius:0 4px 4px 0;
  font-size:13.5px;line-height:1.5;color:var(--ink-deep);
}
.step .do b{font-family:var(--mono);font-size:13px;color:var(--ink)}
.step .do .tag{
  display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent);margin-bottom:3px;font-weight:700;
}
.blurb{
  font-family:var(--serif);font-size:16px;line-height:1.55;
  color:#33475A;margin:0 0 22px;padding-bottom:18px;
  border-bottom:1px solid var(--rule);
}
.step{
  border-left:2px solid var(--rule);
  padding:0 0 22px 16px;margin-left:6px;position:relative;
}
.step.done{border-left-color:var(--ok)}
.step.current{border-left-color:var(--accent)}
.step .n{
  position:absolute;left:-13px;top:0;
  width:24px;height:24px;border-radius:50%;
  background:var(--paper);border:2px solid var(--rule);
  font-family:var(--mono);font-size:11px;font-weight:700;
  display:grid;place-items:center;color:var(--muted);
}
.step.current .n{border-color:var(--accent);color:var(--accent)}
.step.done .n{border-color:var(--ok);background:var(--ok);color:#fff}
.step h3{
  font-family:var(--serif);font-size:17px;font-weight:600;
  margin:0 0 6px;color:var(--ink);
}
.step p{margin:0 0 10px}
.step.locked{opacity:.4}
.step.locked p,.step.locked .row,.step.locked .note{display:none}
.step .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.note{
  margin-top:12px;padding:10px 12px;background:var(--ok-soft);
  border-left:3px solid var(--ok);font-size:14px;color:#204835;
}
.hint{
  margin-top:10px;padding:10px 12px;background:var(--cell);
  border-left:3px solid var(--accent);font-size:14px;
}
.fail{
  margin-top:10px;padding:10px 12px;background:var(--warn-soft);
  border-left:3px solid var(--warn);font-size:14px;color:var(--warn);
}
.fail ul{margin:6px 0 0;padding-left:18px}
code,kbd{font-family:var(--mono);font-size:.92em;background:var(--paper-2);
  padding:1px 5px;border:1px solid var(--rule);border-radius:3px}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:7px 16px;border-radius:3px;cursor:pointer;
  font-size:14px;font-weight:600;
}
.btn:hover{background:var(--ink-deep)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--paper-2)}
.btn:focus-visible,td:focus-visible,input:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

/* ---------- sheet ---------- */
#sheetpane{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--paper-2)}
#formulabar{
  display:flex;align-items:stretch;gap:0;
  background:var(--paper);border-bottom:1px solid var(--rule);
  /* Sticky in every layout. On desktop the grid scrolls inside its own
     pane so this never moves anyway; on a phone the whole page scrolls
     and without this the formula bar disappears the moment you scroll
     down the sheet. */
  position:sticky;top:0;z-index:6;
  box-shadow:0 1px 0 var(--rule);
}
#addr{
  font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink);
  padding:9px 14px;min-width:72px;border-right:1px solid var(--rule);
  display:flex;align-items:center;
}
#fx{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  padding:9px 10px;border-right:1px solid var(--rule);
  display:flex;align-items:center;
}
#input{
  flex:1;border:0;padding:9px 12px;font-family:var(--mono);font-size:14px;
  background:transparent;color:var(--ink-deep);min-width:0;
}
#gridwrap{overflow:auto;padding:16px;flex:1 1 auto;min-height:0}
table{border-collapse:separate;border-spacing:0;background:var(--paper);
  box-shadow:0 1px 0 var(--rule),0 1px 8px rgba(27,58,92,.06)}
th,td{
  border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:0;height:27px;min-width:92px;max-width:92px;
  font-family:var(--mono);font-size:13px;
}
th{
  background:var(--paper-2);color:var(--muted);font-weight:600;font-size:11px;
  text-align:center;position:sticky;top:0;z-index:2;
  border-top:1px solid var(--rule);
}
th.corner{position:sticky;left:0;z-index:3}
th.rowhead{
  position:sticky;left:0;z-index:1;min-width:36px;max-width:36px;
  border-left:1px solid var(--rule);
}
td{
  padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:cell;background:var(--paper);
  touch-action:manipulation;      /* kills the 300ms tap delay */
  -webkit-tap-highlight-color:transparent;
}
/* While you are mid-formula, every cell you could point at lights up,
   so it is obvious that tapping inserts a reference instead of moving. */
#sheetpane.picking td:not(.given){cursor:copy;background:#FAFCFE}
#sheetpane.picking td:not(.given):hover{background:var(--accent-wash,#EAF3FA)}
td.num{text-align:right}
td.given{background:var(--paper-2);color:#3C4C5C;cursor:default}
td.label{text-align:left;color:var(--ink);font-family:var(--sans);font-size:12.5px}
td.head{font-weight:700;color:var(--ink)}
td.sel{outline:2px solid var(--ink);outline-offset:-2px;background:#fff;
  position:relative;z-index:1}
#sheetpane.nav td.sel{outline-color:var(--accent);outline-width:3px}
#gridwrap{outline:none}
#gridwrap:focus-visible{box-shadow:inset 0 0 0 2px var(--accent)}
#keys{
  display:flex;flex-wrap:wrap;gap:14px;padding:7px 16px;
  border-top:1px solid var(--rule);background:var(--paper-2);
  font-size:11.5px;color:var(--muted);
}
#keys kbd{
  font-family:var(--mono);font-size:10.5px;background:var(--paper);
  border:1px solid var(--rule);border-bottom-width:2px;border-radius:3px;
  padding:1px 5px;margin-right:3px;color:var(--ink);
}
td.lit{background:var(--cell)}
td.target{box-shadow:inset 0 0 0 1px var(--accent)}
td.solved{background:var(--ok-soft);color:#204835}
td.err{background:var(--warn-soft);color:var(--warn)}
#msg{
  padding:8px 16px;font-size:13px;min-height:34px;
  border-top:1px solid var(--rule);background:var(--paper);
  font-family:var(--mono);color:var(--muted);
}
#msg.bad{color:var(--warn)}
#done{
  margin:22px 0 0;padding:18px;background:var(--ink);color:#fff;border-radius:4px;
}
#done h3{font-family:var(--serif);margin:0 0 8px;font-size:19px}
#done p{margin:0;color:#CFE0EE;font-size:14px}
@media (prefers-reduced-motion:no-preference){
  .step{transition:border-color .2s} td{transition:background .12s}
}
</style>
</head>
<body>

<header>
  <span class="unit" id="h-unit"></span>
  <h1 id="h-title"></h1>
  <span class="count" id="h-count"></span>
</header>

<main>
  <section id="steps" aria-label="Steps"></section>

  <section id="sheetpane">
    <div id="formulabar">
      <span id="addr">A1</span>
      <span id="fx">fx</span>
      <input id="input" autocomplete="off" spellcheck="false"
             autocapitalize="off" autocorrect="off"
             aria-label="Cell contents. Start with = to write a formula.">
    </div>
    <div id="gridwrap" tabindex="0" role="grid" aria-label="Spreadsheet. Arrow keys move between cells. Type to edit."><table id="grid"></table></div>
    <div id="msg"></div>
    <div id="keys">
      <span><kbd>&larr;&uarr;&darr;&rarr;</kbd> move</span>
      <span><kbd>Enter</kbd> edit, then move down</span>
      <span><kbd>Tab</kbd> move right</span>
      <span><kbd>Esc</kbd> cancel</span>
      <span><kbd>Delete</kbd> clear</span>
      <span>type <kbd>=</kbd> to start a formula</span>
      <span>mid-formula, <kbd>click a cell</kbd> to drop in its reference</span>
    </div>
  </section>
</main>

<script>
/* SELF-CONTAINED BUILD — U3 D3. Engine + shell + lesson inlined. */
/* =====================================================================
   sheet engine — a small, honest spreadsheet
   Formula syntax is deliberately identical to Google Sheets and Excel so
   that everything learned here transfers. Supports: cell refs (A1, $B$2),
   ranges (B11:E11), + - * / ^ and comparisons, parentheses, and the
   functions listed in FUNCS below.
   ===================================================================== */

const colName = (i) => {
  let s = '';
  i += 1;
  while (i > 0) { const r = (i - 1) % 26; s = String.fromCharCode(65 + r) + s; i = (i - r - 1) / 26; }
  return s;
};
const colIndex = (s) => {
  let n = 0;
  for (const ch of s.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
};
const refToRC = (ref) => {
  const m = /^\$?([A-Za-z]+)\$?(\d+)$/.exec(ref);
  if (!m) return null;
  return { c: colIndex(m[1]), r: parseInt(m[2], 10) - 1 };
};
const rcToRef = (r, c) => colName(c) + (r + 1);

/* ---------- tokenizer ---------- */
function tokenize(src) {
  const t = [];
  let i = 0;
  while (i < src.length) {
    const ch = src[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let j = i; while (j < src.length && /[0-9.]/.test(src[j])) j++;
      t.push({ k: 'num', v: parseFloat(src.slice(i, j)) }); i = j; continue;
    }
    if (ch === '"') {
      let j = i + 1, s = '';
      while (j < src.length && src[j] !== '"') { s += src[j]; j++; }
      t.push({ k: 'str', v: s }); i = j + 1; continue;
    }
    if (/[A-Za-z$]/.test(ch)) {
      let j = i; while (j < src.length && /[A-Za-z0-9$_.]/.test(src[j])) j++;
      const word = src.slice(i, j);
      if (src[j] === '(') { t.push({ k: 'fn', v: word.toUpperCase() }); i = j; continue; }
      if (src[j] === ':' && /^\$?[A-Za-z]+\$?\d+$/.test(word)) {
        let k2 = j + 1; while (k2 < src.length && /[A-Za-z0-9$]/.test(src[k2])) k2++;
        t.push({ k: 'range', v: [word, src.slice(j + 1, k2)] }); i = k2; continue;
      }
      if (/^\$?[A-Za-z]+\$?\d+$/.test(word)) { t.push({ k: 'ref', v: word }); i = j; continue; }
      t.push({ k: 'name', v: word.toUpperCase() }); i = j; continue;
    }
    const two = src.slice(i, i + 2);
    if (['<=', '>=', '<>'].includes(two)) { t.push({ k: 'op', v: two }); i += 2; continue; }
    if ('+-*/^(),<>='.includes(ch)) { t.push({ k: 'op', v: ch }); i++; continue; }
    throw new Error(`Unexpected character "${ch}"`);
  }
  return t;
}

/* ---------- parser (recursive descent) ---------- */
function parse(tokens) {
  let p = 0;
  const peek = () => tokens[p];
  const eat = (v) => {
    const t = tokens[p];
    if (!t || (v && t.v !== v)) throw new Error(v ? `Expected "${v}"` : 'Unexpected end of formula');
    p++; return t;
  };
  function primary() {
    const t = peek();
    if (!t) throw new Error('Formula ends too early');
    if (t.k === 'num' || t.k === 'str') { p++; return { n: 'lit', v: t.v }; }
    if (t.k === 'ref') { p++; return { n: 'ref', v: t.v }; }
    if (t.k === 'range') { p++; return { n: 'range', v: t.v }; }
    if (t.k === 'name') {
      p++;
      if (t.v === 'TRUE') return { n: 'lit', v: true };
      if (t.v === 'FALSE') return { n: 'lit', v: false };
      throw new Error(`Unknown name "${t.v}"`);
    }
    if (t.k === 'fn') {
      p++; eat('(');
      const args = [];
      if (peek() && peek().v !== ')') {
        args.push(expr());
        while (peek() && peek().v === ',') { p++; args.push(expr()); }
      }
      eat(')');
      return { n: 'call', f: t.v, args };
    }
    if (t.v === '(') { p++; const e = expr(); eat(')'); return e; }
    if (t.v === '-') { p++; return { n: 'neg', a: primary() }; }
    if (t.v === '+') { p++; return primary(); }
    throw new Error(`Unexpected "${t.v}"`);
  }
  function power() {
    let l = primary();
    while (peek() && peek().v === '^') { p++; l = { n: 'bin', o: '^', l, r: primary() }; }
    return l;
  }
  function term() {
    let l = power();
    while (peek() && (peek().v === '*' || peek().v === '/')) {
      const o = eat().v; l = { n: 'bin', o, l, r: power() };
    }
    return l;
  }
  function add() {
    let l = term();
    while (peek() && (peek().v === '+' || peek().v === '-')) {
      const o = eat().v; l = { n: 'bin', o, l, r: term() };
    }
    return l;
  }
  function expr() {
    let l = add();
    while (peek() && ['<', '>', '=', '<=', '>=', '<>'].includes(peek().v)) {
      const o = eat().v; l = { n: 'bin', o, l, r: add() };
    }
    return l;
  }
  const out = expr();
  if (p < tokens.length) throw new Error('Extra text after the formula');
  return out;
}

/* ---------- functions ---------- */
const flat = (vals) => vals.flat(Infinity);
const nums = (vals) => flat(vals).filter((v) => typeof v === 'number' && isFinite(v));

const FUNCS = {
  SUM: (a) => nums(a).reduce((x, y) => x + y, 0),
  COUNT: (a) => nums(a).length,
  AVERAGE: (a) => { const n = nums(a); if (!n.length) throw new Error('AVERAGE needs numbers'); return n.reduce((x, y) => x + y, 0) / n.length; },
  MIN: (a) => { const n = nums(a); if (!n.length) throw new Error('MIN needs numbers'); return Math.min(...n); },
  MAX: (a) => { const n = nums(a); if (!n.length) throw new Error('MAX needs numbers'); return Math.max(...n); },
  ABS: (a) => Math.abs(nums(a)[0]),
  ROUND: (a) => { const f = flat(a); const d = f.length > 1 ? f[1] : 0; const m = Math.pow(10, d); return Math.round(f[0] * m) / m; },
  IF: (a) => (a[0] ? (a.length > 1 ? a[1] : true) : (a.length > 2 ? a[2] : false)),
  SUMPRODUCT: (a) => {
    const arrs = a.map((x) => flat([x]));
    const len = arrs[0].length;
    if (arrs.some((x) => x.length !== len)) throw new Error('SUMPRODUCT ranges must be the same size');
    let s = 0;
    for (let i = 0; i < len; i++) {
      let pr = 1;
      for (const arr of arrs) pr *= (typeof arr[i] === 'number' ? arr[i] : 0);
      s += pr;
    }
    return s;
  },
};

/* ---------- sheet ---------- */
class Sheet {
  constructor(rows, cols) {
    this.rows = rows; this.cols = cols;
    this.raw = new Map();      // "A1" -> raw string
    this.cache = new Map();    // "A1" -> computed value
    this.errors = new Map();
  }
  setRaw(ref, text) { 
    if (text === '' || text == null) this.raw.delete(ref); else this.raw.set(ref, text);
    this.recalc();
  }
  getRaw(ref) { return this.raw.get(ref) ?? ''; }
  isFormula(ref) { return String(this.getRaw(ref)).trim().startsWith('='); }

  recalc() {
    this.cache.clear(); this.errors.clear();
    for (const ref of this.raw.keys()) {
      try { this.value(ref, new Set()); }
      catch (e) { this.errors.set(ref, e.message); this.cache.set(ref, NaN); }
    }
  }

  value(ref, seen = new Set()) {
    if (this.cache.has(ref)) return this.cache.get(ref);
    const raw = this.raw.get(ref);
    if (raw === undefined || raw === '') return 0;
    // Throw rather than return: returning NaN lets the caller's success path
    // clear the error we just recorded, so the cycle goes unreported.
    if (seen.has(ref)) throw new Error('Circular reference');
    const s = String(raw).trim();
    if (!s.startsWith('=')) {
      const n = Number(s.replace(/[$,%\s]/g, ''));
      const v = (s !== '' && isFinite(n) && /[0-9]/.test(s)) ? n : s;
      this.cache.set(ref, v); return v;
    }
    seen.add(ref);
    let v;
    try {
      v = this.evalNode(parse(tokenize(s.slice(1))), seen);
      this.errors.delete(ref);
    } catch (e) {
      this.errors.set(ref, e.message); v = NaN;
    }
    seen.delete(ref);
    this.cache.set(ref, v); return v;
  }

  rangeRefs(a, b) {
    const A = refToRC(a), B = refToRC(b);
    if (!A || !B) throw new Error('Bad range');
    const out = [];
    for (let r = Math.min(A.r, B.r); r <= Math.max(A.r, B.r); r++)
      for (let c = Math.min(A.c, B.c); c <= Math.max(A.c, B.c); c++)
        out.push(rcToRef(r, c));
    return out;
  }

  evalNode(node, seen) {
    switch (node.n) {
      case 'lit': return node.v;
      case 'neg': return -this.evalNode(node.a, seen);
      case 'ref': {
        const rc = refToRC(node.v);
        if (!rc) throw new Error(`Bad cell reference "${node.v}"`);
        return this.value(rcToRef(rc.r, rc.c), seen);
      }
      case 'range': return this.rangeRefs(node.v[0], node.v[1]).map((r) => this.value(r, seen));
      case 'call': {
        const f = FUNCS[node.f];
        if (!f) throw new Error(`${node.f} is not available here`);
        return f(node.args.map((a) => this.evalNode(a, seen)));
      }
      case 'bin': {
        const l = this.evalNode(node.l, seen), r = this.evalNode(node.r, seen);
        const ln = typeof l === 'number' ? l : (l === '' ? 0 : l);
        const rn = typeof r === 'number' ? r : (r === '' ? 0 : r);
        switch (node.o) {
          case '+': return ln + rn; case '-': return ln - rn;
          case '*': return ln * rn;
          case '/': if (rn === 0) throw new Error('Division by zero'); return ln / rn;
          case '^': return Math.pow(ln, rn);
          case '=': return ln === rn; case '<>': return ln !== rn;
          case '<': return ln < rn; case '>': return ln > rn;
          case '<=': return ln <= rn; case '>=': return ln >= rn;
        }
        throw new Error(`Unknown operator ${node.o}`);
      }
    }
    throw new Error('Could not read that formula');
  }
}

/* Cells and ranges mentioned in a formula — used to light up the grid. */
function referencedCells(src) {
  const out = new Set();
  if (!src || !String(src).trim().startsWith('=')) return out;
  let toks;
  try { toks = tokenize(String(src).trim().slice(1)); } catch { return out; }
  for (const t of toks) {
    if (t.k === 'ref') { const rc = refToRC(t.v); if (rc) out.add(rcToRef(rc.r, rc.c)); }
    if (t.k === 'range') {
      const A = refToRC(t.v[0]), B = refToRC(t.v[1]);
      if (A && B) for (let r = Math.min(A.r, B.r); r <= Math.max(A.r, B.r); r++)
        for (let c = Math.min(A.c, B.c); c <= Math.max(A.c, B.c); c++) out.add(rcToRef(r, c));
    }
  }
  return out;
}

const targetsOf = (i) => (lesson.steps[i] ? lesson.steps[i].targets.map((t) => t.cell) : []);
const fmt = (v) => {
  if (typeof v === 'number') {
    if (!isFinite(v)) return '#ERR';
    return Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v))
         : v.toFixed(Math.abs(v) < 1 ? 4 : 2);
  }
  return v === '' ? '' : String(v);
};

/* ---------- grid ---------- */
function drawGrid() {
  const t = $('grid');
  t.innerHTML = '';
  const head = document.createElement('tr');
  head.appendChild(Object.assign(document.createElement('th'), { className: 'corner' }));
  for (let c = 0; c < lesson.cols; c++) {
    const th = document.createElement('th');
    th.textContent = colName(c);
    head.appendChild(th);
  }
  t.appendChild(head);

  const active = new Set(targetsOf(stepIdx));
  const lit = referencedCells($('input').value);

  for (let r = 0; r < lesson.rows; r++) {
    const tr = document.createElement('tr');
    const rh = document.createElement('th');
    rh.className = 'rowhead'; rh.textContent = r + 1;
    tr.appendChild(rh);
    for (let c = 0; c < lesson.cols; c++) {
      const ref = rcToRef(r, c);
      const td = document.createElement('td');
      const raw = sheet.getRaw(ref);
      const val = raw === '' ? '' : sheet.value(ref);
      td.textContent = sheet.errors.has(ref) ? '#ERR' : fmt(val);
      td.dataset.ref = ref;
      if (typeof val === 'number' && raw !== '') td.classList.add('num');
      if (typeof val === 'string' && val !== '') td.classList.add('label');
      if (given.has(ref)) {
        td.classList.add('given');
        if (/^[A-Z]/.test(String(lesson.given[ref])) || ref === 'A1') td.classList.add('head');
      }
      td.setAttribute('role', 'gridcell');
      td.setAttribute('aria-readonly', given.has(ref) ? 'true' : 'false');
      if (sheet.errors.has(ref)) td.classList.add('err');
      if (active.has(ref)) td.classList.add('target');
      if (doneCells.has(ref)) td.classList.add('solved');
      if (lit.has(ref)) td.classList.add('lit');
      if (ref === sel) td.classList.add('sel');
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
}
const doneCells = new Set();

/* ---------------------------------------------------------------
   Two modes, the way a real spreadsheet works.
   Navigating: the grid holds focus, arrows move the selection.
   Editing:    the formula bar holds focus, arrows move the caret.
   Typing a printable character on a cell starts editing it.
   --------------------------------------------------------------- */

function setMode(mode) {
  editing = (mode === 'edit');
  $('sheetpane').classList.toggle('editing', editing);
  $('sheetpane').classList.toggle('nav', !editing);
  if (editing) $('input').focus();
  else { $('input').blur(); $('gridwrap').focus(); }
  if (!editing) $('sheetpane').classList.remove('picking');
}

function select(ref, { edit = false, seed = null } = {}) {
  if (editing) commit();
  sel = ref;
  $('addr').textContent = ref;
  const readOnly = given.has(ref);
  $('input').readOnly = readOnly;
  $('input').value = seed !== null ? seed : sheet.getRaw(ref);
  say(readOnly ? 'This cell is part of the problem and cannot be changed.' : '');
  drawGrid();
  scrollSelIntoView();
  setMode(edit && !readOnly ? 'edit' : 'nav');
  if (edit && !readOnly && seed !== null) {
    const n = $('input').value.length;
    $('input').setSelectionRange(n, n);
  }
}

function scrollSelIntoView() {
  const td = $('grid').querySelector('td.sel');
  if (td) td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function commit() {
  if (!sel || given.has(sel)) return;
  const v = $('input').value;
  if (v !== sheet.getRaw(sel)) {
    sheet.setRaw(sel, v);
    say(sheet.errors.has(sel) ? sheet.errors.get(sel) : '', sheet.errors.has(sel));
  }
}

function moveBy(dr, dc, opts) {
  const rc = refToRC(sel);
  const r = Math.max(0, Math.min(lesson.rows - 1, rc.r + dr));
  const c = Math.max(0, Math.min(lesson.cols - 1, rc.c + dc));
  select(rcToRef(r, c), opts);
}

/* ---- pointing at cells ----
   pointerdown, not mousedown: one code path for trackpad, touchscreen and
   stylus. Plenty of Chromebooks are touch devices and mousedown alone is
   unreliable there.

   Three things can happen when you point at a cell:
     1. mid-formula  -> insert that cell's reference where the cursor is
     2. already selected -> open it for editing
     3. otherwise    -> just select it                                   */

const OPEN_FOR_REF = /[=+\-*/^(,:%<>]\s*$/;

function pickingRef() {
  if (!editing) return false;
  const el = $('input');
  if (el.readOnly || !el.value.startsWith('=')) return false;
  return OPEN_FOR_REF.test(el.value.slice(0, el.selectionStart));
}

function insertRef(ref) {
  const el = $('input');
  const a = el.selectionStart, b = el.selectionEnd;
  el.value = el.value.slice(0, a) + ref + el.value.slice(b);
  const pos = a + ref.length;
  el.setSelectionRange(pos, pos);
  el.focus();
  drawGrid();
}

function refreshPicking() {
  $('sheetpane').classList.toggle('picking', pickingRef());
}

$('grid').addEventListener('pointerdown', (e) => {
  const td = e.target.closest('td');
  if (!td) return;
  const ref = td.dataset.ref;

  if (pickingRef()) {          // building a formula: point instead of type
    e.preventDefault();        // keep focus in the input
    insertRef(ref);
    return;
  }

  e.preventDefault();
  if (ref === sel && !given.has(ref)) select(ref, { edit: true });
  else select(ref);
});

$('grid').addEventListener('dblclick', (e) => {
  const td = e.target.closest('td');
  if (!td || given.has(td.dataset.ref)) return;
  select(td.dataset.ref, { edit: true });
});

/* ---- navigating ---- */
$('gridwrap').addEventListener('keydown', (e) => {
  if (editing) return;
  const k = e.key;
  const nav = {
    ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1],
  }[k];
  if (nav) { e.preventDefault(); moveBy(nav[0], nav[1]); return; }
  if (k === 'Tab') { e.preventDefault(); moveBy(0, e.shiftKey ? -1 : 1); return; }
  if (k === 'Enter' || k === 'F2') { e.preventDefault(); select(sel, { edit: true }); return; }
  if (k === 'Home') { e.preventDefault(); const rc = refToRC(sel); select(rcToRef(rc.r, 0)); return; }
  if (k === 'End') { e.preventDefault(); const rc = refToRC(sel); select(rcToRef(rc.r, lesson.cols - 1)); return; }
  if (k === 'PageUp') { e.preventDefault(); moveBy(-10, 0); return; }
  if (k === 'PageDown') { e.preventDefault(); moveBy(10, 0); return; }
  if (k === 'Delete' || k === 'Backspace') {
    e.preventDefault();
    if (!given.has(sel)) { sheet.setRaw(sel, ''); $('input').value = ''; drawGrid(); }
    return;
  }
  // A printable character starts editing, with that character already typed.
  if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    if (given.has(sel)) { say('This cell is part of the problem and cannot be changed.'); return; }
    select(sel, { edit: true, seed: k });
  }
});

/* ---- editing ---- */
$('input').addEventListener('input', () => { drawGrid(); refreshPicking(); });
$('input').addEventListener('keyup', refreshPicking);
$('input').addEventListener('click', refreshPicking);
$('input').addEventListener('focus', () => setMode('edit'));
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); commit(); moveBy(1, 0); }
  else if (e.key === 'Tab') { e.preventDefault(); commit(); moveBy(0, e.shiftKey ? -1 : 1); }
  else if (e.key === 'Escape') {
    e.preventDefault();
    $('input').value = sheet.getRaw(sel);
    drawGrid(); setMode('nav');
  }
});

function say(text, bad) { const m = $('msg'); m.textContent = text || ''; m.className = bad ? 'bad' : ''; }

/* ---------- steps ---------- */
function checkStep(i) {
  const bad = [];
  for (const t of lesson.steps[i].targets) {
    const raw = String(sheet.getRaw(t.cell)).trim();
    if (raw === '') { bad.push(`${t.cell} is still empty.`); continue; }
    if (sheet.errors.has(t.cell)) { bad.push(`${t.cell}: ${sheet.errors.get(t.cell)}`); continue; }
    if (t.mustBeFormula && !sheet.isFormula(t.cell)) {
      bad.push(`${t.cell} needs a formula that starts with =, not a typed-in answer.`); continue;
    }
    const v = sheet.value(t.cell);
    if (t.text) {
      if (String(v).trim().toLowerCase() !== String(t.value).toLowerCase())
        bad.push(`${t.cell} does not match one of the debt labels in column A.`);
    } else if (typeof v !== 'number' || Math.abs(v - t.value) > 1e-6) {
      bad.push(`${t.cell} is not right yet.`);
    }
  }
  return bad;
}

function drawSteps() {
  const box = $('steps');
  box.innerHTML = '';
  const b = document.createElement('p');
  b.className = 'blurb'; b.textContent = lesson.blurb;
  box.appendChild(b);

  lesson.steps.forEach((s, i) => {
    const el = document.createElement('article');
    el.className = 'step' + (doneSteps.has(i) ? ' done' : i === stepIdx ? ' current' : ' locked');
    el.innerHTML = `<span class="n">${doneSteps.has(i) ? '✓' : i + 1}</span><h3></h3>`;
    el.querySelector('h3').textContent = s.title;

    if (i === stepIdx || doneSteps.has(i)) {
      const p = document.createElement('p'); p.className = 'body'; p.textContent = s.body; el.appendChild(p);
      if (s.do) {
        const dv = document.createElement('div'); dv.className = 'do';
        const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = 'Your turn';
        dv.appendChild(tg);
        dv.appendChild(document.createTextNode(s.do));
        el.appendChild(dv);
      }
    }
    if (i === stepIdx) {
      if (shownHints.has(i) && s.hint) {
        const h = document.createElement('div'); h.className = 'hint';
        h.textContent = s.hint; el.appendChild(h);
      }
      if (failures.has(i)) {
        const f = document.createElement('div'); f.className = 'fail';
        f.innerHTML = '<strong>Not yet.</strong><ul>' +
          failures.get(i).map((x) => `<li>${x}</li>`).join('') + '</ul>';
        el.appendChild(f);
      }
      const row = document.createElement('div'); row.className = 'row';
      const check = document.createElement('button');
      check.className = 'btn'; check.textContent = 'Check this step';
      check.onclick = () => {
        commit();
        const bad = checkStep(i);
        if (bad.length) { failures.set(i, bad); drawSteps(); }
        else {
          failures.delete(i);
          doneSteps.add(i);
          targetsOf(i).forEach((c) => doneCells.add(c));
          stepIdx = Math.min(i + 1, lesson.steps.length);
          const next = targetsOf(stepIdx).find((c) => !doneCells.has(c));
          drawSteps();
          if (next) select(next, { edit: true }); else drawGrid();
          $('steps').scrollTo({ top: $('steps').scrollHeight, behavior: 'smooth' });
        }
      };
      row.appendChild(check);
      if (s.hint) {
        const hb = document.createElement('button');
        hb.className = 'btn ghost'; hb.textContent = shownHints.has(i) ? 'Hide hint' : 'Show hint';
        hb.onclick = () => { shownHints.has(i) ? shownHints.delete(i) : shownHints.add(i); drawSteps(); };
        row.appendChild(hb);
      }
      el.appendChild(row);
    }
    if (doneSteps.has(i) && s.note) {
      const n = document.createElement('div'); n.className = 'note';
      n.textContent = s.note; el.appendChild(n);
    }
    box.appendChild(el);
  });

  if (doneSteps.size === lesson.steps.length) {
    const d = document.createElement('div'); d.id = 'done';
    d.innerHTML = '<h3></h3><p></p>';
    d.querySelector('h3').textContent = lesson.closing.title;
    const cp = d.querySelector('p'); cp.style.whiteSpace = 'pre-line'; cp.textContent = lesson.closing.body;
    box.appendChild(d);
  }
  $('h-count').textContent = `${doneSteps.size} of ${lesson.steps.length} steps`;
  drawGrid();
}

drawSteps();
select('E4');
setMode('nav');
</script>
</body>
</html>
